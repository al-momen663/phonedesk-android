plugins {
    id 'com.android.application'
}

android {
    namespace 'com.momen.phonedesk'
    compileSdk 34

    defaultConfig {
        applicationId "com.momen.phonedesk"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
