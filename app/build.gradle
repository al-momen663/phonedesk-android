plugins {
    id 'com.android.application'
}

android {
    namespace 'com.momen.phonedesk'
    compileSdk 34

    defaultConfig {
        applicationId "com.momen.phonedesk"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("../phonedesk.jks")
            storePassword "phonedesk123"
            keyAlias "phonedesk"
            keyPassword "phonedesk123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
