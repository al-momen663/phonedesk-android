<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneDesk</title>
<style>
  :root{--bg:#0f1724;--panel:#18233a;--line:#2c3d5e;--text:#e6edf6;--mute:#9fb0c8;--acc:#1e6fd9;--ok:#2ecc71;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{font-size:17px} header .mute{color:var(--mute)} header .sp{flex:1}
  a{color:#7fb2ff}
  main{flex:1;display:flex;min-height:0}
  #screenWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0;position:relative}
  #scr{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 0 0 2px #000,0 8px 30px #0009;
       cursor:crosshair;user-select:none;-webkit-user-drag:none;touch-action:none;background:#000}
  #wait{position:absolute;color:var(--mute);font-size:16px;text-align:center}
  aside{width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;color:var(--mute);padding:10px;cursor:pointer;font-size:14px}
  .tabs button.on{color:var(--text);border-bottom:2px solid var(--acc)}
  .pane{display:none;padding:12px;overflow:auto;flex:1}
  .pane.on{display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .btn{background:#22304d;border:1px solid var(--line);color:var(--text);padding:9px 6px;border-radius:8px;cursor:pointer;font-size:13px}
  .btn:hover{background:#2a3b5f} .btn.acc{background:var(--acc);border-color:var(--acc)}
  h4{margin:16px 0 8px;color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  input[type=text],select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .row{display:flex;gap:6px;margin-top:6px}
  .row>*{flex:1}
  label.chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mute)}
  #files{margin-top:8px}
  .f{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid #223150}
  .f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
  .f .n.dir{cursor:pointer;color:#cfe0ff}
  .f .s{color:var(--mute);font-size:12px;white-space:nowrap}
  .f button{background:none;border:0;cursor:pointer;font-size:14px;color:var(--mute)}
  table{width:100%;border-collapse:collapse} td{padding:6px 2px;border-bottom:1px solid #223150} td:first-child{color:var(--mute)}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#331a1a;color:#ffd0d0;border:1px solid #6b2b2b;
         padding:10px 16px;border-radius:10px;display:none;max-width:80vw;z-index:9}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  @media (max-width:800px){main{flex-direction:column} aside{width:auto;height:45vh;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <b>PhoneDesk</b>
  <span class="mute" id="hdr">connecting…</span>
  <span class="sp"></span>
  <a href="/logout">Log out</a>
</header>
<main>
  <div id="screenWrap">
    <div id="wait">Waiting for screen…<br><small>Is "Start remote access" on in the phone app?</small></div>
    <img id="scr" alt="" draggable="false">
  </div>
  <aside>
    <div class="tabs">
      <button class="on" data-t="ctl">Control</button>
      <button data-t="fs">Files</button>
      <button data-t="info">Device</button>
    </div>

    <div class="pane on" id="ctl">
      <h4>Navigation</h4>
      <div class="grid">
        <button class="btn" data-k="back">◀ Back</button>
        <button class="btn" data-k="home">● Home</button>
        <button class="btn" data-k="recents">■ Recents</button>
        <button class="btn" data-k="notifications">Notifications</button>
        <button class="btn" data-k="quick">Quick settings</button>
        <button class="btn" data-k="split">Split screen</button>
        <button class="btn" data-k="screenshot">Screenshot</button>
        <button class="btn" data-k="lock">Lock</button>
        <button class="btn" data-k="power">Power menu</button>
      </div>

      <h4>Keyboard</h4>
      <label class="chk"><input type="checkbox" id="kbd"> Send my PC keyboard to the phone</label>
      <div class="row"><input type="text" id="txt" placeholder="Type text, press Enter to send"></div>
      <div class="row">
        <button class="btn" id="sendTxt">Send text</button>
        <button class="btn" data-e="backspace">⌫</button>
        <button class="btn" data-e="enter">↵ Enter</button>
        <button class="btn" data-e="clear">Clear</button>
      </div>
      <p class="mute" style="color:var(--mute)">Tap a text box on the phone screen first.</p>

      <h4>Scroll</h4>
      <div class="grid">
        <button class="btn" data-sw="0.5,0.3,0.5,0.75">▲ Up</button>
        <button class="btn" data-sw="0.5,0.75,0.5,0.3">▼ Down</button>
        <button class="btn" data-sw="0.5,0.005,0.5,0.6">Pull down</button>
        <button class="btn" data-sw="0.85,0.5,0.15,0.5">◀ Left</button>
        <button class="btn" data-sw="0.15,0.5,0.85,0.5">Right ▶</button>
        <button class="btn" data-sw="0.5,0.97,0.5,0.4">Swipe up</button>
      </div>

      <h4>Stream quality</h4>
      <div class="row">
        <select id="q">
          <option value="40,540">Low – fast / mobile data</option>
          <option value="60,720" selected>Medium</option>
          <option value="80,1080">High – same Wi-Fi</option>
        </select>
      </div>
      <p style="color:var(--mute)">Mouse: click = tap · hold = long-press · drag = swipe · wheel = scroll · right-click = Back</p>
    </div>

    <div class="pane" id="fs">
      <div class="row"><input type="text" id="path"></div>
      <div class="row">
        <button class="btn" id="up">⬆ Up</button>
        <button class="btn" id="go">Open</button>
        <button class="btn" id="mk">New folder</button>
        <button class="btn acc" id="upl">Upload</button>
      </div>
      <input type="file" id="file" multiple hidden>
      <div id="upst" style="color:var(--mute);margin-top:6px"></div>
      <div id="files"></div>
    </div>

    <div class="pane" id="info"><table id="infoT"></table></div>
  </aside>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const img = $('#scr');

function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4000); }

async function api(name, params={}, body=null){
  try{
    const r = await fetch('/api/'+name+'?'+new URLSearchParams(params), {method: body!==null||name!=='info'&&name!=='ls' ? 'POST':'GET', body});
    if (r.status===401){ location.reload(); return {}; }
    const j = await r.json();
    if (j.ok===false && j.error) toast(j.error);
    return j;
  }catch(e){ toast('Phone not reachable'); return {}; }
}

// ---------------- screen stream
function startStream(){ img.src='/stream?'+Date.now(); }
img.onload = ()=>{ $('#wait').style.display='none'; };
img.onerror = ()=>{ $('#wait').style.display='block'; setTimeout(startStream, 2000); };
startStream();

function norm(e){ const r=img.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; }
let down=null;
img.addEventListener('pointerdown', e=>{ if(e.button!==0) return; e.preventDefault(); img.setPointerCapture(e.pointerId);
  const [x,y]=norm(e); down={x,y,t:performance.now()}; });
img.addEventListener('pointerup', e=>{ if(!down) return; const [x,y]=norm(e); const dt=performance.now()-down.t;
  const dist=Math.hypot((x-down.x)*img.clientWidth,(y-down.y)*img.clientHeight);
  if(dist<8) api(dt>450?'long':'tap',{x,y});
  else api('swipe',{x1:down.x,y1:down.y,x2:x,y2:y,ms:Math.round(Math.max(80,Math.min(dt,2500)))});
  down=null; });
img.addEventListener('contextmenu', e=>{ e.preventDefault(); api('key',{k:'back'}); });
let wheelT=0;
img.addEventListener('wheel', e=>{ e.preventDefault(); const now=Date.now(); if(now-wheelT<180) return; wheelT=now;
  const [x,y]=norm(e); const d=e.deltaY>0?-0.25:0.25;
  api('swipe',{x1:x,y1:y,x2:x,y2:Math.min(0.95,Math.max(0.05,y+d)),ms:160}); }, {passive:false});

// ---------------- buttons
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>api('key',{k:b.dataset.k}));
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>api('edit',{op:b.dataset.e}));
document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{ const [x1,y1,x2,y2]=b.dataset.sw.split(','); api('swipe',{x1,y1,x2,y2,ms:250}); });
$('#sendTxt').onclick=()=>{ const v=$('#txt').value; if(v){ api('text',{},v); $('#txt').value=''; } };
$('#txt').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#sendTxt').click(); } });
$('#q').onchange=()=>{ const [q,res]=$('#q').value.split(','); api('quality',{q,res}); };

// live keyboard
let buf='', bufT=null;
function flush(){ if(buf){ api('text',{},buf); buf=''; } }
document.addEventListener('keydown', e=>{
  if(!$('#kbd').checked || e.target.tagName==='INPUT' || e.target.tagName==='SELECT') return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key.length===1){ buf+=e.key; clearTimeout(bufT); bufT=setTimeout(flush,150); e.preventDefault(); }
  else if(e.key==='Backspace'){ flush(); api('edit',{op:'backspace'}); e.preventDefault(); }
  else if(e.key==='Enter'){ flush(); api('edit',{op:'enter'}); e.preventDefault(); }
  else if(e.key==='Escape'){ api('key',{k:'back'}); }
  else if(e.key==='Home'){ api('key',{k:'home'}); }
});

// ---------------- tabs
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t));
  if(b.dataset.t==='fs' && !$('#files').innerHTML) ls('');
  if(b.dataset.t==='info') info();
});

// ---------------- files
function size(n){ if(n<1024) return n+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{n/=1024;i++;}while(n>=1024&&i<3); return n.toFixed(1)+' '+u[i]; }
let cwd='', parent=null;
async function ls(p){
  const j = await api('ls',{path:p});
  if(!j.path) return;
  cwd=j.path; parent=j.parent; $('#path').value=cwd;
  const box=$('#files'); box.innerHTML='';
  if(j.error){ box.innerHTML='<p style="color:var(--bad)">'+j.error+'</p>'; return; }
  if(!j.items.length) box.innerHTML='<p style="color:var(--mute)">(empty)</p>';
  for(const it of j.items){
    const full = cwd.replace(/\/$/,'')+'/'+it.n;
    const row=document.createElement('div'); row.className='f';
    const n=document.createElement('span'); n.className='n'+(it.d?' dir':''); n.textContent=(it.d?'📁 ':'📄 ')+it.n; n.title=it.n;
    if(it.d) n.onclick=()=>ls(full);
    const s=document.createElement('span'); s.className='s'; s.textContent=it.d?'':size(it.s);
    row.append(n,s);
    if(!it.d){ const a=document.createElement('a'); a.href='/api/dl?'+new URLSearchParams({path:full}); a.textContent='⬇'; a.title='Download'; row.append(a); }
    const del=document.createElement('button'); del.textContent='🗑'; del.title='Delete';
    del.onclick=async()=>{ if(confirm('Delete '+it.n+' from the phone?')){ await api('rm',{path:full}); ls(cwd); } };
    row.append(del); box.append(row);
  }
}
$('#go').onclick=()=>ls($('#path').value);
$('#path').addEventListener('keydown',e=>{ if(e.key==='Enter') ls($('#path').value); });
$('#up').onclick=()=>{ if(parent) ls(parent); };
$('#mk').onclick=async()=>{ const n=prompt('Folder name'); if(n){ await api('mkdir',{path:cwd+'/'+n}); ls(cwd); } };
$('#upl').onclick=()=>$('#file').click();
$('#file').onchange=async()=>{
  const files=[...$('#file').files];
  for(let i=0;i<files.length;i++){
    $('#upst').textContent=`Uploading ${i+1}/${files.length}: ${files[i].name}…`;
    await api('up',{dir:cwd,name:files[i].name},files[i]);
  }
  $('#upst').textContent=files.length?'Upload finished.':''; $('#file').value=''; ls(cwd);
};

// ---------------- info
async function info(){
  const j = await api('info'); if(!j.model) return;
  $('#hdr').innerHTML = j.model+' · 🔋 '+j.battery+'%'+(j.charging?' ⚡':'')+
    ' · <span class="dot" style="background:'+(j.touch?'var(--ok)':'var(--bad)')+'"></span>'+(j.touch?'touch on':'touch OFF');
  const rows=[['Model',j.model],['Android',j.android],['Battery',j.battery+'%'+(j.charging?' (charging)':'')],
    ['Screen',j.screen],['Storage free', j.storageTotal? size(j.storageFree)+' of '+size(j.storageTotal):'?'],
    ['Uptime',Math.floor(j.uptimeMin/60)+' h '+(j.uptimeMin%60)+' min'],
    ['Remote touch',j.touch?'enabled':'NOT enabled'],['File access',j.files?'allowed':'NOT allowed']];
  $('#infoT').innerHTML = rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('');
}
info(); setInterval(info, 10000);
</script>
</body>
</html>
